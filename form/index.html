<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>
<body>
    <h1>HTML Form</h1>
    <form action="submit" method="post">
    <form>
        <label for="username">Username:</label>
        <input type="text" id="username"/>

        <label for="password">Password:</label>
        <input type="password" id="password"/>

        <label for="email">Email:</label>
        <input type="email" id="email"/><br/>

        <input type="radio" id="male" name="gender" value="Male"/>
        <label for="male">Male</label><br/>

        <input type="radio" id="female" name="gender" value="Female"/>
        <label for="female">Female</label><br/>

        <label for="cars">Choose a Car:</label>
        <select name="cars" id="cars">
            <option value=" "disabled selected>Select Cars</option>
            <option value="volvo">Volvo</option>
            <option value="saab">Saab</option>
            <option value="mercedes">Mercedes</option>
            <option value="audi">Audi</option>
        </select>
        <br/>
        
        <label for="fav_books">Favourite Books:</label>

        <input type="checkbox" value="Math" name="fav_book" id="Math"/>
        <label for="math">Math</label>
        <input type="checkbox" value="Science" name="fav_book" id="Science"/>
         <label for="science">Science</label>
        <input type="checkbox" value="Computer Science" name="fav_book" id="Computer Science"/>
        <label for="Computer Science">Computer Science</label>
    </br>
        <input type="submit" value="Submit">
        
    </form>
</body>
</html>
